name: 同步到 itch.io

on:
  push:
    branches: [main]
    paths: ['index.html', 'version.json']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 準備上載檔案
        run: |
          mkdir -p build
          cp index.html build/
          for f in version.json manifest.json apple-touch-icon.png; do [ -f "$f" ] && cp "$f" build/ || true; done

      - name: 安裝 butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: 推送到 itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          VER=$(grep -o '"v": *"[^"]*"' version.json | sed 's/.*"\([^"]*\)"$/\1/')
          ./butler push build bubupixel/xiaoyao-game:html --userversion "${VER:-manual}"
